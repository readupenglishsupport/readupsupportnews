<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readup Support News</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#cf1717;--brand-d:#a81212;--brand-l:#fdecec;--bs-primary:#cf1717;--bs-primary-rgb:207,23,23;--bs-link-color:#cf1717;--bs-link-hover-color:#a81212}
body{font-family:'Montserrat',system-ui,sans-serif;background:#f6f4f4;color:#222}
.btn-primary{--bs-btn-bg:var(--brand);--bs-btn-border-color:var(--brand);--bs-btn-hover-bg:var(--brand-d);--bs-btn-hover-border-color:var(--brand-d);--bs-btn-active-bg:var(--brand-d);--bs-btn-active-border-color:var(--brand-d);--bs-btn-disabled-bg:var(--brand);--bs-btn-disabled-border-color:var(--brand)}
.btn-outline-primary{--bs-btn-color:var(--brand);--bs-btn-border-color:var(--brand);--bs-btn-hover-bg:var(--brand);--bs-btn-hover-border-color:var(--brand);--bs-btn-active-bg:var(--brand);--bs-btn-active-border-color:var(--brand)}
.form-control:focus,.form-select:focus{border-color:var(--brand);box-shadow:0 0 0 .2rem rgba(207,23,23,.15)}
.brand{font-weight:800;color:var(--brand);letter-spacing:-.02em;text-decoration:none}
/* Loader */
#loader{position:fixed;inset:0;z-index:2000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .3s}
#loader.hide{opacity:0;pointer-events:none}
#loader .brand{font-size:2rem}
.bar{width:200px;height:5px;background:#eee;border-radius:5px;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--brand);border-radius:5px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* Header */
.topbar{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(0,0,0,.06)}
/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--brand-l),#fff)}
.auth-card{width:100%;max-width:420px;border:0;border-radius:16px;box-shadow:0 10px 40px rgba(207,23,23,.12)}
.pw{position:relative}.pw .form-control{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:#888;padding:6px 10px}
/* Sidebar */
.side{background:#fff;border-radius:14px;padding:14px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.nav-item-x{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:500}
.nav-item-x:hover{background:#f3f3f3}.nav-item-x.on{background:var(--brand-l);color:var(--brand);font-weight:700}
.nav-item-x .x{margin-left:auto;opacity:0;border:0;background:none;color:#999}.nav-item-x:hover .x{opacity:1}
.day{font-size:.72rem;font-weight:700;color:#999;margin:14px 0 4px 4px}
.art{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.84rem;line-height:1.35;border-left:3px solid transparent}
.art:hover{background:#f6f4f4}.art.on{border-left-color:var(--brand);background:var(--brand-l)}
/* Reader */
.reader-card{background:#fff;border-radius:14px;padding:clamp(18px,4vw,44px)}
#reader{font-size:1.08rem;line-height:1.85;max-width:72ch;margin:auto}
#reader img{max-width:100%;height:auto;border-radius:10px;margin:14px 0}
#reader h2,#reader h3{font-weight:700;margin-top:1.6em}
#reader figure{margin:0}#reader figcaption{font-size:.8rem;color:#888}
mark{background:#fff176;padding:1px 0;border-radius:3px;cursor:pointer;border-bottom:2px solid #f9a825}
mark.has-note{background:#a5f3fc;border-bottom-color:#0891b2}
#hlBtn{position:fixed;z-index:1500;display:none}
#tip,#editor{position:fixed;z-index:1600;display:none}
#tip{max-width:300px;background:#212529;color:#fff;padding:8px 12px;border-radius:8px;font-size:.84rem;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-wrap}
#editor{width:300px;background:#e0f7fa;border:1px solid #67e8f9;border-radius:10px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
</style>
</head>
<body>

<div id="loader"><div class="brand">Readup Support News</div><div class="bar"><i></i></div></div>

<!-- AUTH -->
<div id="authView" class="auth-wrap" style="display:none">
  <div class="card auth-card"><div class="card-body p-4">
    <div class="text-center mb-3"><div class="brand fs-3">Readup Support News</div><div class="text-muted small">Đọc báo, highlight và ghi chú từ vựng</div></div>
    <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
      <li class="nav-item"><button class="nav-link active" data-m="login">Đăng nhập</button></li>
      <li class="nav-item"><button class="nav-link" data-m="signup">Tạo tài khoản</button></li>
    </ul>
    <div id="authMsg"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Email</label><input id="aEmail" type="email" class="form-control" autocomplete="email"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Mật khẩu</label><div class="pw"><input id="aPass" type="password" class="form-control" autocomplete="current-password"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
    <div class="mb-3" id="confWrap" style="display:none"><label class="form-label small fw-semibold">Nhập lại mật khẩu</label><div class="pw"><input id="aPass2" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
    <button id="authBtn" class="btn btn-primary w-100 fw-semibold">Đăng nhập</button>
  </div></div>
</div>

<!-- APP -->
<div id="appView" style="display:none">
  <header class="topbar"><div class="container-fluid px-3 px-lg-4 py-2 d-flex align-items-center">
    <a class="brand fs-5" href="#"><i class="bi bi-newspaper me-2"></i>Readup Support News</a>
    <div class="dropdown ms-auto">
      <button class="btn btn-light rounded-pill dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle me-1"></i><span id="uMail" class="d-none d-sm-inline"></span></button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0">
        <li><button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#pwModal"><i class="bi bi-key me-2"></i>Đổi mật khẩu</button></li>
        <li><hr class="dropdown-divider"></li>
        <li><button class="dropdown-item text-danger" id="logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button></li>
      </ul>
    </div>
  </div></header>

  <div class="container-fluid px-3 px-lg-4 py-3"><div class="row g-3">
    <aside class="col-lg-3"><div class="side">
      <div class="nav-item-x on" id="navAll"><i class="bi bi-calendar3"></i>Tất cả (theo ngày)</div>
      <div class="d-flex align-items-center mt-3 mb-1"><span class="small fw-bold text-muted ms-1">Thư mục</span><button class="btn btn-sm btn-outline-primary ms-auto py-0" id="addFolder"><i class="bi bi-folder-plus"></i></button></div>
      <div id="folderList"></div>
      <div class="small fw-bold text-muted mt-3 ms-1">Bài báo</div>
      <div id="artList"></div>
    </div></aside>

    <main class="col-lg-9">
      <div class="input-group input-group-lg mb-3 shadow-sm">
        <span class="input-group-text bg-white"><i class="bi bi-link-45deg"></i></span>
        <input id="urlIn" class="form-control" placeholder="Dán link bài báo vào đây…">
        <button id="fetchBtn" class="btn btn-primary px-4 fw-semibold">Đọc</button>
      </div>
      <div id="readerBox"><div class="reader-card text-center text-muted py-5"><i class="bi bi-book fs-1 text-danger"></i><p class="mt-2 mb-0">Dán link một bài báo để bắt đầu đọc, hoặc chọn bài đã lưu bên trái.</p></div></div>
    </main>
  </div></div>
</div>

<!-- Đổi mật khẩu -->
<div class="modal fade" id="pwModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0">
  <div class="modal-header"><h6 class="modal-title fw-bold">Đổi mật khẩu</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="pwMsg"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Mật khẩu mới</label><div class="pw"><input id="np1" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
    <div><label class="form-label small fw-semibold">Nhập lại mật khẩu mới</label><div class="pw"><input id="np2" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
  </div>
  <div class="modal-footer border-0"><button class="btn btn-primary" id="pwSave">Lưu mật khẩu</button></div>
</div></div></div>

<button id="hlBtn" class="btn btn-sm btn-warning shadow fw-semibold"><i class="bi bi-highlighter me-1"></i>Highlight</button>
<div id="tip"></div>
<div id="editor">
  <div class="small fw-bold mb-1"><i class="bi bi-pencil-square me-1"></i>Ghi chú cho từ này</div>
  <textarea id="noteTxt" class="form-control form-control-sm" rows="4" placeholder="Dán nghĩa, ví dụ, phiên âm…"></textarea>
  <div class="d-flex gap-2 mt-2"><button class="btn btn-sm btn-primary" id="noteSave">Lưu</button><button class="btn btn-sm btn-light" id="noteClose">Đóng</button><button class="btn btn-sm btn-outline-danger ms-auto" id="noteDel" title="Xóa highlight"><i class="bi bi-trash"></i></button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js"></script>
<script>
const sb = supabase.createClient('https://vjvvyadldyvqtjjsscfm.supabase.co','sb_publishable_0-6FZl4pVfLQJ_Cvclo7mw_SruO5EDj');
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user, articles=[], folders=[], cur=null, view='all', mode='login', editId=null;

const loader = on => $('#loader').classList.toggle('hide', !on);
const alertBox = (el,msg,type='danger') => $(el).innerHTML = msg ? `<div class="alert alert-${type} py-2 small">${msg}</div>` : '';

/* ---------- Mắt xem/ẩn mật khẩu ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('.eye'); if(!b) return;
  const i = b.parentElement.querySelector('input'), show = i.type==='password';
  i.type = show?'text':'password'; b.innerHTML = `<i class="bi bi-eye${show?'-slash':''}"></i>`;
});

/* ---------- Đăng nhập / đăng ký ---------- */
$('#authTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if(!b) return;
  mode = b.dataset.m;
  document.querySelectorAll('#authTabs .nav-link').forEach(x=>x.classList.toggle('active',x===b));
  $('#confWrap').style.display = mode==='signup'?'block':'none';
  $('#authBtn').textContent = mode==='signup'?'Tạo tài khoản':'Đăng nhập';
  alertBox('#authMsg','');
});
$('#authBtn').onclick = async () => {
  const email=$('#aEmail').value.trim(), pass=$('#aPass').value;
  if(!email||!pass) return alertBox('#authMsg','Vui lòng nhập email và mật khẩu.');
  if(mode==='signup'){
    if(pass.length<6) return alertBox('#authMsg','Mật khẩu cần ít nhất 6 ký tự.');
    if(pass!==$('#aPass2').value) return alertBox('#authMsg','Hai mật khẩu chưa khớp.');
  }
  loader(true);
  const {data,error} = mode==='signup' ? await sb.auth.signUp({email,password:pass}) : await sb.auth.signInWithPassword({email,password:pass});
  loader(false);
  if(error) return alertBox('#authMsg', error.message);
  if(mode==='signup' && !data.session) return alertBox('#authMsg','Đã tạo tài khoản. Hãy kiểm tra email để xác nhận rồi đăng nhập.','success');
  boot(data.session);
};
['#aEmail','#aPass','#aPass2'].forEach(s=>$(s).addEventListener('keydown',e=>e.key==='Enter'&&$('#authBtn').click()));
$('#logout').onclick = async()=>{ await sb.auth.signOut(); location.reload(); };

$('#pwSave').onclick = async () => {
  const a=$('#np1').value, b=$('#np2').value;
  if(a.length<6) return alertBox('#pwMsg','Mật khẩu cần ít nhất 6 ký tự.');
  if(a!==b) return alertBox('#pwMsg','Hai mật khẩu chưa khớp.');
  const {error} = await sb.auth.updateUser({password:a});
  if(error) return alertBox('#pwMsg',error.message);
  alertBox('#pwMsg','Đã đổi mật khẩu.','success'); $('#np1').value=$('#np2').value='';
};

/* ---------- Khởi động ---------- */
async function boot(session){
  if(!session){ $('#authView').style.display='flex'; $('#appView').style.display='none'; return loader(false); }
  user = session.user; $('#uMail').textContent = user.email;
  $('#authView').style.display='none'; $('#appView').style.display='block';
  await loadData(); loader(false);
}
(async()=>{ const {data}=await sb.auth.getSession(); setTimeout(()=>boot(data.session),500); })();

async function loadData(){
  const [f,a] = await Promise.all([
    sb.from('folders').select('*').order('created_at'),
    sb.from('articles').select('id,title,url,folder_id,created_at').order('created_at',{ascending:false})
  ]);
  folders=f.data||[]; articles=a.data||[]; renderSide();
}

/* ---------- Sidebar: thư mục + bài theo ngày ---------- */
function dayLabel(d){
  const x=new Date(d), t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
  if(x.toDateString()===t.toDateString()) return 'Hôm nay';
  if(x.toDateString()===y.toDateString()) return 'Hôm qua';
  return x.toLocaleDateString('vi-VN');
}
function renderSide(){
  $('#navAll').classList.toggle('on',view==='all');
  $('#folderList').innerHTML = folders.map(f=>`<div class="nav-item-x ${view===f.id?'on':''}" data-f="${f.id}"><i class="bi bi-folder2"></i><span>${esc(f.name)}</span><button class="x" data-del="${f.id}"><i class="bi bi-x-lg"></i></button></div>`).join('') || '<div class="small text-muted ms-1">Chưa có thư mục.</div>';
  const list = articles.filter(a=>view==='all'||a.folder_id===view);
  let html='',last='';
  list.forEach(a=>{ const d=dayLabel(a.created_at); if(d!==last){html+=`<div class="day">${d}</div>`;last=d;}
    html+=`<div class="art ${cur&&cur.id===a.id?'on':''}" data-a="${a.id}">${esc(a.title)}</div>`; });
  $('#artList').innerHTML = html || '<div class="small text-muted ms-1">Chưa có bài nào.</div>';
}
$('#navAll').onclick=()=>{view='all';renderSide();};
$('#folderList').onclick = async e => {
  const del=e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); if(!confirm('Xóa thư mục? Bài báo vẫn được giữ lại và xếp theo ngày.')) return;
    await sb.from('folders').delete().eq('id',del.dataset.del); if(view===del.dataset.del) view='all'; return loadData(); }
  const f=e.target.closest('[data-f]'); if(f){ view=f.dataset.f; renderSide(); }
};
$('#addFolder').onclick = async () => {
  const name=prompt('Tên thư mục mới:'); if(!name||!name.trim()) return;
  const {error}=await sb.from('folders').insert({user_id:user.id,name:name.trim()}); if(error) return alert(error.message); loadData();
};
$('#artList').onclick = async e => {
  const a=e.target.closest('[data-a]'); if(!a) return;
  loader(true); const {data}=await sb.from('articles').select('*').eq('id',a.dataset.a).single(); loader(false);
  if(data) openArticle(data);
};

/* ---------- Lấy bài báo từ link ---------- */
async function getHTML(u){
  try{ const {data,error}=await sb.functions.invoke('fetch-article',{body:{url:u}}); if(!error&&data&&data.html&&data.html.length>500) return data.html; }catch(e){}
  const proxies=[x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x), x=>'https://corsproxy.io/?url='+encodeURIComponent(x)];
  for(const p of proxies){ try{ const r=await fetch(p(u)); if(r.ok){ const t=await r.text(); if(t.length>500) return t; } }catch(e){} }
  throw new Error('Không tải được trang này.');
}
$('#fetchBtn').onclick = async () => {
  const u=$('#urlIn').value.trim(); if(!/^https?:\/\//i.test(u)) return alert('Hãy dán một đường link hợp lệ (bắt đầu bằng http/https).');
  loader(true);
  try{
    const html=await getHTML(u), doc=new DOMParser().parseFromString(html,'text/html');
    const base=doc.createElement('base'); base.href=u; doc.head.prepend(base);
    const art=new Readability(doc).parse(); if(!art) throw new Error('Không trích xuất được nội dung bài báo.');
    const box=document.createElement('div'); box.innerHTML=art.content;
    box.querySelectorAll('script,style,iframe,form,noscript').forEach(n=>n.remove());
    box.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{ if(/^on/i.test(a.name)) n.removeAttribute(a.name); }));
    box.querySelectorAll('img').forEach(i=>{ i.setAttribute('referrerpolicy','no-referrer'); i.removeAttribute('srcset'); i.loading='lazy'; });
    const {data,error}=await sb.from('articles').insert({user_id:user.id,url:u,title:art.title||u,content:box.innerHTML,notes:{},folder_id:view==='all'?null:view}).select().single();
    if(error) throw error;
    $('#urlIn').value=''; await loadData(); openArticle(data);
  }catch(e){ alert(e.message||'Có lỗi xảy ra.'); }
  loader(false);
};
$('#urlIn').addEventListener('keydown',e=>e.key==='Enter'&&$('#fetchBtn').click());

/* ---------- Trình đọc ---------- */
function openArticle(a){
  cur=a; cur.notes=cur.notes||{}; renderSide();
  $('#readerBox').innerHTML=`<div class="reader-card">
    <div style="max-width:72ch;margin:auto">
      <h1 class="fw-bold mb-2" style="font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.3">${esc(a.title)}</h1>
      <div class="d-flex flex-wrap align-items-center gap-2 small text-muted mb-3">
        <a href="${esc(a.url)}" target="_blank" rel="noopener" class="text-decoration-none"><i class="bi bi-box-arrow-up-right me-1"></i>Nguồn</a>
        <span>${new Date(a.created_at).toLocaleString('vi-VN')}</span>
        <select id="moveSel" class="form-select form-select-sm ms-auto" style="width:auto"><option value="">Không thư mục (theo ngày)</option>${folders.map(f=>`<option value="${f.id}" ${a.folder_id===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
        <button class="btn btn-sm btn-outline-danger" id="delArt"><i class="bi bi-trash"></i></button>
      </div>
      <div class="alert alert-light border small py-2"><i class="bi bi-lightbulb text-warning me-1"></i>Bôi đen chữ cần học → bấm <b>Highlight</b> → nhập ghi chú. Rê chuột vào chữ đã highlight để xem ghi chú, bấm vào để sửa.</div>
    </div>
    <div id="reader">${a.content}</div></div>`;
  $('#moveSel').onchange=async e=>{ a.folder_id=e.target.value||null; await sb.from('articles').update({folder_id:a.folder_id}).eq('id',a.id); const x=articles.find(z=>z.id===a.id); if(x) x.folder_id=a.folder_id; renderSide(); };
  $('#delArt').onclick=async()=>{ if(!confirm('Xóa bài báo này?')) return; await sb.from('articles').delete().eq('id',a.id); cur=null; $('#readerBox').innerHTML=''; loadData(); };
  window.scrollTo({top:0,behavior:'smooth'});
}
async function saveArticle(){
  if(!cur) return;
  const html=$('#reader').innerHTML;
  cur.content=html;
  const {error}=await sb.from('articles').update({content:html,notes:cur.notes}).eq('id',cur.id);
  if(error) alert('Lưu thất bại: '+error.message);
}

/* ---------- Highlight + ghi chú ---------- */
let savedRange=null;
document.addEventListener('mouseup', e => {
  if(e.target.closest('#hlBtn,#editor')) return;
  setTimeout(()=>{
    const s=getSelection(), r=$('#reader');
    if(!r||s.isCollapsed||!r.contains(s.anchorNode)||!r.contains(s.focusNode)){ $('#hlBtn').style.display='none'; return; }
    savedRange=s.getRangeAt(0).cloneRange();
    const b=savedRange.getBoundingClientRect(), h=$('#hlBtn');
    h.style.display='block'; h.style.left=Math.max(8,b.left+b.width/2-45)+'px'; h.style.top=Math.max(8,b.top-42)+'px';
  },10);
});
$('#hlBtn').onmousedown=e=>e.preventDefault();
$('#hlBtn').onclick = async () => {
  if(!savedRange) return;
  const id='h'+Date.now().toString(36), m=document.createElement('mark'); m.dataset.id=id;
  m.appendChild(savedRange.extractContents()); savedRange.insertNode(m);
  getSelection().removeAllRanges(); $('#hlBtn').style.display='none';
  cur.notes[id]=''; await saveArticle(); openEditor(m);
};
function openEditor(m){
  editId=m.dataset.id; $('#noteTxt').value=cur.notes[editId]||'';
  const b=m.getBoundingClientRect(), ed=$('#editor');
  ed.style.display='block';
  ed.style.left=Math.min(innerWidth-316,Math.max(8,b.left))+'px';
  ed.style.top=Math.min(innerHeight-220,b.bottom+8)+'px';
  $('#noteTxt').focus();
}
$('#noteClose').onclick=()=>{$('#editor').style.display='none';};
$('#noteSave').onclick=async()=>{
  const v=$('#noteTxt').value.trim(), m=$(`#reader mark[data-id="${editId}"]`);
  cur.notes[editId]=v; if(m) m.classList.toggle('has-note',!!v);
  await saveArticle(); $('#editor').style.display='none';
};
$('#noteDel').onclick=async()=>{
  const m=$(`#reader mark[data-id="${editId}"]`);
  if(m){ m.replaceWith(...m.childNodes); } delete cur.notes[editId];
  $('#reader').normalize(); await saveArticle(); $('#editor').style.display='none';
};
document.addEventListener('click',e=>{
  const m=e.target.closest('#reader mark'); if(m&&getSelection().isCollapsed) openEditor(m);
});
/* Rê chuột hiện ghi chú */
document.addEventListener('mouseover',e=>{
  const m=e.target.closest('#reader mark'), t=$('#tip');
  if(!m||!cur){ t.style.display='none'; return; }
  const n=cur.notes[m.dataset.id]; if(!n){ t.style.display='none'; return; }
  m.classList.add('has-note'); t.textContent=n; t.style.display='block';
  const b=m.getBoundingClientRect();
  t.style.left=Math.min(innerWidth-320,Math.max(8,b.left))+'px';
  t.style.top=Math.max(8,b.top-t.offsetHeight-8)+'px';
});
</script>
</body>
</html>
