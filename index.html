<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readup Support News</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Readup"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#cf1717">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png?v=2"><link rel="manifest" href="manifest.webmanifest">
<script src="js/theme-init.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/pdf.css" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<clipPath id="fs"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="ft"><path d="M30 15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath>
<g id="f-en" clip-path="url(#fs)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#ft)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g>
<g id="f-vi"><rect width="30" height="20" fill="#da251d"/><polygon fill="#ff0" points="15,4 11.47,14.85 20.71,8.15 9.29,8.15 18.53,14.85"/></g>
</defs></svg>

<div id="loader"><div class="brand">Readup Support News</div><div class="bar"><i></i></div></div>

<div id="authView" class="auth-wrap vfade" style="display:none">
  <div class="tools-slot position-fixed top-0 end-0 p-3"></div>
  <div class="card auth-card"><div class="card-body p-4">
    <div class="text-center mb-3"><div class="brand fs-3">Readup Support News</div><div class="text-muted small" data-i18n="tag"></div></div>
    <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
      <li class="nav-item"><button class="nav-link active" data-m="login" data-i18n="login"></button></li>
      <li class="nav-item"><button class="nav-link" data-m="signup" data-i18n="signup"></button></li>
    </ul>
    <div id="authMsg"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Email</label><input id="aEmail" type="email" class="form-control" autocomplete="email"></div>
    <div class="mb-3"><label class="form-label small fw-semibold" data-i18n="pass"></label><div class="pw"><input id="aPass" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
    <div class="mb-3" id="confWrap" style="display:none"><label class="form-label small fw-semibold" data-i18n="pass2"></label><div class="pw"><input id="aPass2" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
    <button id="authBtn" class="btn btn-primary w-100 fw-semibold"></button>
  </div></div>
</div>

<div id="appView" class="vfade" style="display:none">
  <header class="topbar"><div class="container-fluid px-3 px-lg-4 py-2 d-flex align-items-center">
    <button class="btn btn-outline-secondary d-lg-none me-2 px-2 py-1" data-bs-toggle="offcanvas" data-bs-target="#sideCanvas" aria-label="Menu"><i class="bi bi-list fs-5"></i></button><a class="brand fs-5 text-nowrap" href="#" id="brandHome"><img src="logo.png" alt="" class="brand-logo me-2"><span class="d-none d-sm-inline">Readup Support News</span><span class="d-sm-none">Readup</span></a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <div class="tools-slot"></div>
      <div class="dropdown">
        <button class="btn btn-outline-secondary rounded-pill dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle me-1"></i><span id="uMail" class="d-none d-md-inline"></span></button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
          <li><button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#pwModal"><i class="bi bi-key me-2"></i><span data-i18n="chpw"></span></button></li>
          <li><button class="dropdown-item" id="instBtn"><i class="bi bi-phone me-2"></i><span data-i18n="install"></span></button></li><li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" id="logout"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="logout"></span></button></li>
        </ul>
      </div>
    </div>
  </div></header>
  <div class="container-fluid px-3 px-lg-4 py-3"><div class="row g-3">
    <aside class="col-lg-3"><div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sideCanvas"><div class="offcanvas-header border-bottom"><span class="brand"><i class="bi bi-folder2-open me-2"></i><span data-i18n="manage"></span></span><button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sideCanvas"></button></div><div class="offcanvas-body"><div class="side">
      <div class="nav-item-x" id="navHome"><i class="bi bi-house-door"></i><span data-i18n="home"></span></div><div class="nav-item-x on" id="navAll"><i class="bi bi-calendar3"></i><span data-i18n="all"></span></div><div class="nav-item-x" id="navFav"><i class="bi bi-star-fill text-warning"></i><span data-i18n="fav"></span></div><div class="nav-item-x" id="navTools"><i class="bi bi-grid-3x3-gap"></i><span data-i18n="tools"></span></div>
      <div class="d-flex align-items-center mt-3 mb-1"><span class="small fw-bold text-muted ms-1" data-i18n="folders"></span><button class="btn btn-sm btn-outline-primary ms-auto py-0" id="addFolder"><i class="bi bi-folder-plus"></i></button></div>
      <div id="folderList"></div>
      <div class="small fw-bold text-muted mt-3 ms-1" data-i18n="arts"></div>
      <div id="artList"></div>
    </div></div></div></aside>
    <main class="col-lg-9">
      <div class="input-group input-group-lg mb-3 shadow-sm">
        <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
        <input id="urlIn" class="form-control" data-ph="urlPh">
        <button id="pasteBtn" type="button" class="btn btn-warning btn-action fw-semibold" data-i18n-title="paste"><i class="bi bi-clipboard"></i><span class="btn-label" data-i18n="paste"></span></button>
        <button id="fetchBtn" class="btn btn-primary btn-action fw-semibold" data-i18n-title="read"><i class="bi bi-book"></i><span class="btn-label" data-i18n="read"></span></button>
      </div>
      <div id="readerBox"></div>
    </main>
  </div></div>
</div>

<div class="modal fade" id="pwModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0">
  <div class="modal-header"><h6 class="modal-title fw-bold" data-i18n="chpw"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="pwMsg"></div>
    <div class="mb-3"><label class="form-label small fw-semibold" data-i18n="npw"></label><div class="pw"><input id="np1" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
    <div><label class="form-label small fw-semibold" data-i18n="npw2"></label><div class="pw"><input id="np2" type="password" class="form-control"><button type="button" class="eye"><i class="bi bi-eye"></i></button></div></div>
  </div>
  <div class="modal-footer border-0"><button class="btn btn-primary" id="pwSave" data-i18n="savepw"></button></div>
</div></div></div>

<div class="modal fade" id="cfModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0">
  <div class="modal-body p-4 text-center"><i id="cfIcon" class="bi fs-1"></i><p id="cfMsg" class="mt-2 mb-0 fw-semibold"></p></div>
  <div class="modal-footer border-0 justify-content-center"><button class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="cancel"></button><button class="btn btn-primary" id="cfOk"></button></div>
</div></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:3500"><div id="toastEl" class="toast text-bg-dark border-0"><div class="toast-body" id="toastMsg"></div></div></div>
<div class="modal fade" id="lkModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content border-0">
  <div class="modal-header"><h6 class="modal-title fw-bold"><i class="bi bi-translate me-2"></i><span data-i18n="lookup"></span></h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <textarea id="lkText" class="form-control form-control-sm mb-2" rows="2"></textarea>
    <div class="d-flex gap-2 mb-3"><select id="lkLang" class="form-select form-select-sm" style="width:auto"><option value="vi">Tiếng Việt</option><option value="en">English</option></select><button id="lkGo" class="btn btn-sm btn-primary"><i class="bi bi-search me-1"></i><span data-i18n="lookupGo"></span></button></div>
    <div id="lkOut"></div><div id="lkLinks" class="d-flex flex-wrap gap-2 mt-3"></div>
  </div>
  <div class="modal-footer border-0"><button id="lkCopy" class="btn btn-sm btn-outline-secondary"><i class="bi bi-clipboard me-1"></i><span data-i18n="copy"></span></button><button id="lkInsert" class="btn btn-sm btn-primary"><i class="bi bi-journal-plus me-1"></i><span data-i18n="toNote"></span></button></div>
</div></div></div>
<div class="modal fade" id="instModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0"><div class="modal-header"><h6 class="modal-title fw-bold"><i class="bi bi-phone me-2"></i><span data-i18n="install"></span></h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body small" id="instBody"></div></div></div></div>
<div id="artMenu" class="pop"></div>
<div id="hlMenu" class="pop">
  <div id="hlNote" class="hm-note" style="display:none"></div><div class="hm-t" data-i18n="hlColor"></div><div id="hlColors"></div>
  <hr class="my-1"><div class="hm-g"><button class="hm-a" id="actCopy"><i class="bi bi-clipboard me-1"></i><span data-i18n="copy"></span></button><button class="hm-a" id="actLook"><i class="bi bi-translate me-1"></i><span data-i18n="lookupGo"></span></button></div>
  <div id="hlActs" class="hm-g"><hr class="my-1">
    <button class="hm-a" id="actNote"><i class="bi bi-chat-square-text me-2"></i><span data-i18n="note"></span></button>
    <button class="hm-a" id="actRem"><i class="bi bi-eraser me-2"></i><span data-i18n="removeHl"></span></button>
    <button class="hm-a" id="actAll"><i class="bi bi-trash me-2"></i><span data-i18n="clearAll"></span></button>
  </div>
</div>
<div id="tip" class="pop"></div>
<div id="editor" class="pop">
  <div class="small fw-bold mb-1"><i class="bi bi-pencil-square me-1"></i><span data-i18n="noteTitle"></span></div>
  <textarea id="noteTxt" class="form-control form-control-sm" rows="4" data-ph="notePh"></textarea>
  <div class="d-flex gap-2 mt-2"><button class="btn btn-sm btn-primary" id="noteSave" data-i18n="save"></button><button class="btn btn-sm btn-outline-secondary" id="noteClose" data-i18n="close"></button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/feed-home.js"></script>
<script src="js/article-fetch.js"></script>
<script src="js/sidebar-active.js"></script>
<script src="js/tools.js"></script>
<script src="js/pdf-reader.js"></script>
</body>
</html>
